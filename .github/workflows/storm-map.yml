name: Storm map

on:
  schedule:
    - cron: "*/10 * * * *"  # GitHub may start scheduled runs several minutes late
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: research/requinoa-2026
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run requinoa-realtime
      - name: Assemble site
        run: |
          mkdir -p site
          cp data/realtime/status.html site/index.html
          cp data/realtime/status.json site/status.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: research/requinoa-2026/site
      - id: deploy
        uses: actions/deploy-pages@v4
      # Pilot Web Push for invited testers. Off unless the PUSH_ENABLED variable is
      # "true" (the kill switch), and never fails the map update.
      - name: Send pilot notifications
        if: vars.PUSH_ENABLED == 'true'
        continue-on-error: true
        run: uv run requinoa-push
        env:
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
          PUSH_SENDER_TOKEN: ${{ secrets.PUSH_SENDER_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
