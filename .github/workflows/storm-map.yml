name: Storm map

on:
  schedule:
    - cron: "*/10 * * * *"  # GitHub may start scheduled runs several minutes late
  workflow_dispatch:

permissions:
  contents: write  # only for the per-run build commit below; the checkout keeps no credentials
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: research/requinoa-2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run requinoa-realtime
      - name: Assemble site
        run: |
          mkdir -p site
          cp data/realtime/status.html site/index.html
          cp data/realtime/status.json site/status.json
      - id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: research/requinoa-2026/site
      # actions/deploy-pages labels every deployment with the commit sha. On 2026-11-05 Pages
      # kept serving an old copy while every run with that same label reported success.
      # Pages only accepts a commit sha as the label, so each run creates a commit object
      # (on no branch) and deploys under its sha.
      - id: deploy
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: head } = await github.rest.git.getCommit({ owner, repo, commit_sha: context.sha });
            const { data: build } = await github.rest.git.createCommit({
              owner,
              repo,
              message: `Pages build for run ${context.runId}`,
              tree: head.tree.sha,
              parents: [context.sha],
            });
            const version = build.sha;
            const { data } = await github.request("POST /repos/{owner}/{repo}/pages/deployments", {
              owner,
              repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            });
            core.setOutput("page_url", data.page_url);
            const deployment = { owner, repo, id: data.id };
            // Pages can sit in "deployment_queued" for several minutes (2026-11-06: over 3);
            // wait up to 7 like actions/deploy-pages (10), within the job's 12-minute limit.
            for (let i = 0; i < 84; i++) {
              await new Promise((done) => setTimeout(done, 5000));
              const { data: state } = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{id}", deployment);
              core.info(`Pages deployment ${version}: ${state.status}`);
              if (state.status === "succeed") return;
              if (/fail|error|cancel|expired/.test(state.status)) throw new Error(`Pages deployment ${state.status}`);
            }
            // A deployment left in progress blocks every later one, so give up on it explicitly
            // (as actions/deploy-pages does) and let the next run publish.
            await github.request("POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel", deployment);
            throw new Error("Pages deployment timed out and was cancelled");
      # Pilot Web Push for invited testers. Off unless the PUSH_ENABLED variable is
      # "true" (the kill switch), and never fails the map update.
      - name: Send pilot notifications
        if: vars.PUSH_ENABLED == 'true'
        continue-on-error: true
        run: uv run requinoa-push
        env:
          PUSH_ENABLED: ${{ vars.PUSH_ENABLED }}
          PUSH_SENDER_TOKEN: ${{ secrets.PUSH_SENDER_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
